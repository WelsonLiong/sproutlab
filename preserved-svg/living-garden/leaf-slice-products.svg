<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" role="img" aria-labelledby="lg-leaf-slice-title lg-leaf-slice-desc" class="lg-art lg-leaf-slice" data-state="products"><title id="lg-leaf-slice-title">Leaf Slice</title><desc id="lg-leaf-slice-desc">Simplified enlarged side view of a leaf. Chloroplasts are inside cells. A vein supplies water. Carbon dioxide enters and oxygen leaves through the gap on the underside. Not to scale.</desc><style>
.lg-leaf-slice .leaf-water-stream,.lg-leaf-slice .carbon-stream,.lg-leaf-slice .oxygen-stream,.lg-leaf-slice .food-symbol,.lg-leaf-slice .energy-rays,.lg-leaf-slice .focus-label{opacity:0}
.lg-leaf-slice[data-state="water"] .leaf-water-stream,.lg-leaf-slice[data-state="water"] .water-label,.water-arrived .lg-leaf-slice .leaf-water-stream{opacity:1}
.lg-leaf-slice[data-state="gas"] .carbon-stream,.lg-leaf-slice[data-state="gas"] .gas-label,.gas-arrived .lg-leaf-slice .carbon-stream{opacity:1}
.lg-leaf-slice[data-state="light"] .energy-rays,.lg-leaf-slice[data-state="light"] .light-label,.light-arrived .lg-leaf-slice .energy-rays{opacity:1}
.lg-leaf-slice[data-state="products"] .oxygen-stream,.lg-leaf-slice[data-state="products"] .food-symbol,.lg-leaf-slice[data-state="products"] .product-label,.has-products .lg-leaf-slice .oxygen-stream,.has-products .lg-leaf-slice .food-symbol{opacity:1}
