<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="lg-channel-straight-title lg-channel-straight-desc" class="lg-art lg-channel-straight" data-state="neutral"><title id="lg-channel-straight-title">Channel Straight</title><desc id="lg-channel-straight-desc">Drawn straight water channel. Rotate the real tile control; ports lie exactly on the viewBox edge midpoints.</desc><rect x="2" y="2" width="96" height="96" rx="10" fill="#d9be8f" stroke="#173e4b" stroke-width="3" /><path d="M0 50H100" fill="none" stroke="#6b6756" stroke-width="33" stroke-linecap="round" stroke-linejoin="round" class="channel"/><path d="M0 50H100" fill="none" stroke="#93bdc0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path class="water-flow" d="M0 50H100" fill="none" stroke="#44b6df" stroke-width="17" pathLength="100" data-part="flow"/><path d="M0 50H100" fill="none" stroke="#c4f2f3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 12"/></svg>
