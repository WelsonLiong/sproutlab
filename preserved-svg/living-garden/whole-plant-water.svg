<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" role="img" aria-labelledby="lg-whole-plant-title lg-whole-plant-desc" class="lg-art lg-whole-plant" data-state="water"><title id="lg-whole-plant-title">Whole Plant</title><desc id="lg-whole-plant-desc">A rooted plant with connected roots, stem, petioles and leaves. Water travels inside a root, stem and leaf vein. Transparent background; ground level is y366.</desc><style>
.lg-whole-plant .water-stream,.lg-whole-plant .zoom-ring{opacity:0}
.lg-whole-plant .energy-rays{opacity:var(--sunlight,0)}
.lg-whole-plant .plant-cloud{transform:translateX(calc(var(--sunlight,0)*105px));opacity:calc(1 - var(--sunlight,0))}
.lg-whole-plant[data-state="water"] .water-stream,.water-arrived .lg-whole-plant .water-stream{opacity:1}
.lg-whole-plant[data-state="selected"] .zoom-ring{opacity:1}
.lg-whole-plant[data-state="light"] .energy-rays{opacity:1}
.lg-whole-plant[data-state="light"] .plant-cloud{opacity:0}
